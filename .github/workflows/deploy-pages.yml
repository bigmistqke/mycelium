name: Publish the knowledge graph

# The docs tree is already a website: every node, spec, plan and template is a
# standalone HTML document linking to its neighbours by relative path. Nothing
# needs building. The one generated file is the index — a rendered view of the
# graph whose nodes link back into the documents.
on:
  push:
    branches: [main]
    paths:
      - '.mycelium/**'
      - 'src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Deploys through the Pages service rather than by pushing to a branch, so
# there is no second copy of the site living in git history.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede one already queued,
# but don't cancel a deploy that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The whole history, because the drawing dates every entry by the commit
      # that added it. A shallow clone has no such commit to find, so the
      # default depth of 1 published all 383 entries stacked in one column.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing a graph that fails its own audits would put claims on the
      # web that the project already knows are malformed. This is the same
      # command used locally and it exits non-zero on any failure.
      - name: Validate the graph
        run: pnpm mycelium validate

      # The figure engine decides everything from measured boxes, so no check
      # that runs without a browser can reach it. These open each test document
      # in the Chrome this image already carries. CHROMEWEBDRIVER points at a
      # matching driver, so nothing downloads one.
      - name: Run the browser tests
        run: pnpm mycelium canon test

      - name: Build the index
        run: node src/run.ts notebook generate graph --out index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .mycelium

      - id: deploy
        uses: actions/deploy-pages@v5
