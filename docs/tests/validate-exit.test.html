<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: validate fails the build and says why</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../templates/test.template.css">
</head>
<body>

<test-doc data-conforms-to="../templates/test.template.html#test-doc">
  <test-title>validate fails the build and says why</test-title>
  <test-subject><a href="../commands/validate.command.html">validate.command.html</a></test-subject>

  <test-case id="exits-non-zero-on-any-failure" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>a run with something wrong in it exits non-zero</test-name>
    <test-status>PENDING</test-status>
    <a data-rel="depends_on" href="../canon/validate.canon.html#exits-non-zero-on-any-failure">the behaviour this checks</a>
    <script type="mycelium/test">
      // The exit code is the whole of what a build reads, so this case runs the
      // real command line in its own process rather than calling the function.
      // Nothing an in-memory run reports can establish what a process returns.
      //
      // The tree carries its own validator so it needs no generic one, which
      // keeps it self-contained: --dir names it, and the run reads nothing else.
      import type { TestContext } from "../../src/api.ts"
      import { tidyTree } from "./validate-fixture.ts"

      export default async function ({ assert, sandbox }: TestContext) {
        for (const [path, text] of Object.entries(tidyTree({ withBroken: false }))) sandbox.write(path, text)
        const clean = sandbox.mycelium("validate", "--dir", "docs/tidy")
        assert(clean.ok, `a clean tree exited ${clean.status}: ${clean.stdout}${clean.stderr}`)

        sandbox.write("tidy/bad.thing.html", tidyTree({ withBroken: true })["tidy/bad.thing.html"])
        const dirty = sandbox.mycelium("validate", "--dir", "docs/tidy")
        assert(!dirty.ok, `a tree with a failure in it still exited zero: ${dirty.stdout}`)
      }
    </script>
  </test-case>

  <test-case id="prints-every-failure-before-exiting" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>a failing run prints what went wrong before it exits</test-name>
    <test-status>PENDING</test-status>
    <a data-rel="depends_on" href="../canon/validate.canon.html#prints-every-failure-before-exiting">the behaviour this checks</a>
    <script type="mycelium/test">
      // A verdict nobody can read is a verdict nobody acts on. The command sets
      // process.exitCode rather than calling exit(), so the output above it
      // still flushes; a case that only read the code could not tell the
      // difference.
      import type { TestContext } from "../../src/api.ts"
      import { tidyTree } from "./validate-fixture.ts"

      export default async function ({ assert, sandbox }: TestContext) {
        for (const [path, text] of Object.entries(tidyTree({ withBroken: true }))) sandbox.write(path, text)
        const run = sandbox.mycelium("validate", "--dir", "docs/tidy")

        assert(!run.ok, `expected the run to fail: ${run.stdout}`)
        assert(
          run.stdout.includes("a thing needs a title"),
          `the failing run printed no reason: ${run.stdout}${run.stderr}`,
        )
        assert(
          run.stdout.includes("bad.thing.html"),
          `the failing run did not name what failed: ${run.stdout}`,
        )
        assert(
          /\d+ checked, \d+ fail/.test(run.stdout),
          `the failing run printed no counts: ${run.stdout}`,
        )
      }
    </script>
  </test-case>
</test-doc>

</body>
</html>
