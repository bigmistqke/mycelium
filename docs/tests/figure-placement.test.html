<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: a figure places its nodes where they say</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../templates/test.template.css">
<link rel="stylesheet" href="../templates/figure.template.css">
<script src="../templates/figure.element.js"></script>
<script src="../templates/test.element.js"></script>
</head>
<body>

<test-doc data-conforms-to="../templates/test.template.html#test-doc">
  <test-title>A figure places its nodes in the cells they declare</test-title>
  <test-subject><a href="../templates/figure.element.js">figure.element.js</a></test-subject>

  <test-case id="data-at-decides-the-cell" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>A node lands in the row and column its data-at names</test-name>
    <test-status>PENDING</test-status>
    <test-fixture>
      <figure-graph data-columns="3">
        <figure-node id="one" data-at="1,1">one</figure-node>
        <figure-node id="two" data-at="1,3">two</figure-node>
        <figure-node id="three" data-at="2,2">three</figure-node>
        <figure-edge from="one" to="three"></figure-edge>
      </figure-graph>
    </test-fixture>
    <script type="mycelium/test">
      // This document loads figure.element.js from the head, which is the case
      // that used to break. A figure upgrades at its own start tag, before its
      // nodes exist, so placement found nothing and every node fell into grid
      // auto-placement. Under that failure all three sit in row one, so the
      // row assertion below is the one that catches it.
      await settle(fixture)

      const graph = fixture.querySelector("figure-graph")
      const box = (id) => graph.querySelector(`figure-node[id="${id}"]`).getBoundingClientRect()
      const one = box("one")
      const two = box("two")
      const three = box("three")

      assert(three.top >= one.bottom, "the node declaring row two did not land below row one")
      assert(one.top === two.top, "two nodes declaring row one did not share a row")

      // Column three, with column two empty beside it in the same row.
      assert(two.left > one.right, "the node declaring column three sits left of column one's node")

      // Column two, so between the other two rather than under either.
      assert(three.left > one.left && three.right < two.right,
        `the node declaring column two spans ${three.left.toFixed(0)}–${three.right.toFixed(0)}, outside the middle column`)
    </script>
  </test-case>
</test-doc>

</body>
</html>
