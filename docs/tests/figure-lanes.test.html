<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: the figure engine's lane allocation</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../templates/test.template.css">
<link rel="stylesheet" href="../templates/figure.template.css">
<script src="../templates/figure.element.js"></script>
<script src="../templates/test.element.js"></script>
</head>
<body>

<test-doc data-conforms-to="../templates/test.template.html#test-doc">
  <test-title>The figure engine allocates lanes per channel</test-title>
  <test-subject><a href="../templates/figure.element.js">figure.element.js</a></test-subject>

  <test-case id="merge-shares-one-lane" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>Three edges into one box share a single lane</test-name>
    <test-status>PENDING</test-status>
    <test-fixture>
      <figure-graph data-columns="3">
        <figure-node id="a" data-at="1,1">a</figure-node>
        <figure-node id="b" data-at="1,2">b</figure-node>
        <figure-node id="c" data-at="1,3">c</figure-node>
        <figure-node id="sink" data-at="2,2">sink</figure-node>
        <figure-edge from="a" to="sink"></figure-edge>
        <figure-edge from="b" to="sink"></figure-edge>
        <figure-edge from="c" to="sink"></figure-edge>
      </figure-graph>
    </test-fixture>
    <script type="text/mycelium-test">
      // Three sources, one target. Grouping edges by their source gives this
      // three lanes and draws three near-parallel lines into one box, which is
      // what grouping by connected component exists to fix. A fork would pass
      // either way, so a merge is the case worth pinning down.
      await settle(fixture)

      const wires = Array.from(fixture.querySelectorAll("svg.figure-wires path.wire"))
      assert(wires.length === 3, `expected three wires, drew ${wires.length}`)

      // "M x,y L x,lane L x2,lane L x2,y2" — the second point's y is the lane
      // the edge crosses its gap in.
      const laneOf = (wire) => Number(wire.getAttribute("d").trim().split(/\s+/)[1].replace(/^L/, "").split(",")[1])
      const lanes = wires.map(laneOf)

      assert.near(lanes[0], lanes[1], 0.5, "the first two edges took different lanes")
      assert.near(lanes[1], lanes[2], 0.5, "the last two edges took different lanes")
    </script>
  </test-case>

  <test-case id="back-edge-keeps-to-its-column" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>A back edge runs inside the column reserved for it</test-name>
    <test-status>PENDING</test-status>
    <test-fixture>
      <figure-graph data-columns="edge node">
        <figure-node id="top" data-at="1,1">top</figure-node>
        <figure-node id="bottom" data-at="2,1">bottom</figure-node>
        <figure-edge from="top" to="bottom"></figure-edge>
        <figure-edge from="bottom" to="top" data-back>re-enters</figure-edge>
      </figure-graph>
    </test-fixture>
    <script type="text/mycelium-test">
      // The gutter is a grid column, so the grid sizes it to the label and no
      // length of text can push the wire out of the figure. Both halves of that
      // claim are measurable: the wire runs left of every box, and the label
      // sits in the column as an ordinary grid item.
      await settle(fixture)

      const graph = fixture.querySelector("figure-graph")
      const back = graph.querySelector('svg.figure-wires path.wire[data-kind="back"]')
      assert(back, "no back edge was drawn")

      // Every coordinate the element writes is relative to the padding box,
      // because the overlay it draws into sits inset:0 inside the border.
      const frame = graph.getBoundingClientRect()
      const inset = getComputedStyle(graph)
      const origin = {
        left: frame.left + parseFloat(inset.borderLeftWidth),
        top: frame.top + parseFloat(inset.borderTopWidth),
      }
      const leftmostBox = Math.min(...Array.from(graph.querySelectorAll("figure-node"))
        .map((node) => node.getBoundingClientRect().left - origin.left))

      const gutterX = Number(back.getAttribute("d").trim().split(/\s+/)[1].replace(/^L/, "").split(",")[0])
      assert(gutterX < leftmostBox,
        `the back edge runs at x=${gutterX.toFixed(1)}, which is not left of the boxes at x=${leftmostBox.toFixed(1)}`)

      const label = graph.querySelector('.figure-label[data-kind="back"][data-in-column]')
      assert(label, "the back edge's label never became a grid item")
      assert(label.getBoundingClientRect().right - origin.left <= leftmostBox,
        "the label overlaps the boxes instead of keeping to its column")
    </script>
  </test-case>
</test-doc>

</body>
</html>
