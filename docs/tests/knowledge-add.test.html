<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: what knowledge add and knowledge link write</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../templates/test.template.css">
</head>
<body>

<test-doc data-conforms-to="../templates/test.template.html#test-doc">
  <test-title>knowledge add and knowledge link write what they promise</test-title>
  <test-subject><a href="../templates/knowledge.template.html">knowledge.template.html</a></test-subject>

  <test-case id="add-dates-the-filename" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>add prepends today's date to a bare slug</test-name>
    <test-status>PENDING</test-status>
    <script type="mycelium/test">
      // The slug a caller passes carries no date, and the command supplies one.
      // That split is the reason add takes an undated slug while every other
      // command takes a whole filename.
      import type { TestContext } from "../../src/api.ts"
      export default async function ({ assert, sandbox }: TestContext) {
        const done = sandbox.mycelium(
          "knowledge", "add", "goal",
          "--title", "A sandboxed goal",
          "--confidence", "50",
          "--status", "pending",
          "--file", "sample-goal",
        )
        assert(done.ok, `add failed: ${done.stderr || done.stdout}`)

        const today = new Date().toISOString().slice(0, 10)
        const path = `knowledge/${today}-sample-goal.goal.html`
        assert(sandbox.exists(path), `wrote no ${path}; said: ${done.stdout.trim()}`)

        const html = sandbox.read(path)
        assert(html.includes("<knowledge-title>A sandboxed goal</knowledge-title>"), "the title is missing")
        assert(html.includes("<knowledge-confidence>50</knowledge-confidence>"), "the confidence is missing")
        assert(html.includes("<knowledge-status>pending</knowledge-status>"), "the status is missing")
        assert(
          html.includes('data-conforms-to="../templates/knowledge.template.html#knowledge-goal"'),
          "the node claims conformance to nothing",
        )
      }
    </script>
  </test-case>

  <test-case id="add-refuses-a-dated-slug" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>add refuses a slug that already carries a date</test-name>
    <test-status>PENDING</test-status>
    <script type="mycelium/test">
      // This used to write a filename carrying the date twice. Such a node
      // validates, so the only symptom was the name, and the surrounding prose
      // talks about dated filenames constantly enough that the mistake looks
      // like it is following the convention.
      import type { TestContext } from "../../src/api.ts"
      export default async function ({ assert, sandbox }: TestContext) {
        const done = sandbox.mycelium(
          "knowledge", "add", "observation",
          "--title", "Already dated",
          "--confidence", "50",
          "--file", "2026-08-06-already-dated",
        )
        assert(!done.ok, "a slug carrying a date was accepted")

        const complaint = done.stderr + done.stdout
        assert(complaint.includes("already-dated"), `the error names no slug to use instead: ${complaint.trim()}`)
        assert(!sandbox.exists("knowledge/2026-08-06-2026-08-06-already-dated.observation.html"), "it wrote the doubled name anyway")
      }
    </script>
  </test-case>

  <test-case id="link-writes-into-the-from-file" data-conforms-to="../templates/test.template.html#test-case">
    <test-name>link writes the edge into the first file, not the second</test-name>
    <test-status>PENDING</test-status>
    <script type="mycelium/test">
      // Argument order decides direction, and getting it backwards still runs
      // without complaint. It leaves an edge pointing the wrong way for a later
      // audit to catch, or for nothing to catch when the relation happens to
      // satisfy none of them.
      import type { TestContext } from "../../src/api.ts"
      export default async function ({ assert, sandbox }: TestContext) {
        const today = new Date().toISOString().slice(0, 10)
        const make = (type: string, slug: string, extra: string[]) => {
          const done = sandbox.mycelium(
            "knowledge", "add", type,
            "--title", slug,
            "--confidence", "50",
            "--file", slug,
            ...extra,
          )
          assert(done.ok, `add ${type} failed: ${done.stderr || done.stdout}`)
          return `${today}-${slug}.${type}.html`
        }

        const goal = make("goal", "the-goal", ["--status", "pending"])
        const outcome = make("outcome", "the-outcome", [])

        const done = sandbox.mycelium("knowledge", "link", goal, outcome, "--rel", "leads_to", "--label", "what happened")
        assert(done.ok, `link failed: ${done.stderr || done.stdout}`)

        const from = sandbox.read(`knowledge/${goal}`)
        const to = sandbox.read(`knowledge/${outcome}`)

        assert(from.includes('data-rel="leads_to"'), "the edge is not in the file named first")
        assert(from.includes(`href="./${outcome}"`), "the edge in the first file points somewhere else")
        assert(!to.includes('data-rel="leads_to"'), "the edge landed in the file named second as well")
      }
    </script>
  </test-case>
</test-doc>

</body>
</html>
